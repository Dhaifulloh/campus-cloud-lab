quarkus.application.name=campus-cloud-reference
quarkus.http.port=${HTTP_PORT:8080}

# PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:campus}
quarkus.datasource.password=${DB_PASSWORD:campus}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/campus_cloud}
quarkus.flyway.migrate-at-start=true
# quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.schema-management.strategy=none
# RabbitMQ
rabbitmq-host=${RABBITMQ_HOST:localhost}
rabbitmq-port=${RABBITMQ_PORT:5672}
rabbitmq-username=${RABBITMQ_USER:campus}
rabbitmq-password=${RABBITMQ_PASSWORD:campus}

mp.messaging.outgoing.reservation-events.connector=smallrye-rabbitmq
mp.messaging.outgoing.reservation-events.exchange.name=reservation.events
mp.messaging.outgoing.reservation-events.exchange.declare=true
mp.messaging.outgoing.reservation-events.default-routing-key=reservation.created

mp.messaging.incoming.reservation-events-in.connector=smallrye-rabbitmq
mp.messaging.incoming.reservation-events-in.exchange.name=reservation.events
mp.messaging.incoming.reservation-events-in.exchange.declare=true
mp.messaging.incoming.reservation-events-in.queue.name=reservation.audit
mp.messaging.incoming.reservation-events-in.queue.declare=true
mp.messaging.incoming.reservation-events-in.routing-keys=reservation.created

# Metrics and health
quarkus.micrometer.export.prometheus.enabled=true
quarkus.smallrye-health.root-path=/q/health

# OpenTelemetry tracing
quarkus.otel.enabled=true
quarkus.otel.traces.enabled=true
quarkus.otel.exporter.otlp.endpoint=${OTEL_ENDPOINT:http://localhost:4317}
quarkus.log.console.format=%d{HH:mm:ss} %-5p traceId=%X{traceId} spanId=%X{spanId} [%c{2.}] %s%e%n

# OIDC is disabled in the default classroom profile.
quarkus.oidc.enabled=${OIDC_ENABLED:false}
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:http://localhost:8081/realms/campus-cloud}
quarkus.oidc.client-id=${OIDC_CLIENT_ID:campus-cloud-app}
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path=realm_access/roles
