apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: campus-cloud-app
  namespace: campus-cloud
spec:
  rules:
    - host: campus.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: campus-cloud-app
                port:
                  number: 80
